---
- name: sshd role
  tags:
    - sshd
  block:

  # sshd_config_overrides
  - name: Copy sshd config overrides
    when: 
    - sshd_config_overrides != None
    - sshd_config_overrides is string
    - sshd_config_overrides | trim | length > 0
    become: true
    notify: Reload ssh.service
    ansible.builtin.copy:
      content: |
        # Managed by Ansible - Do Not Edit Manually

        {{ sshd_config_overrides }}
      dest: /etc/ssh/sshd_config.d/99-ansible-overrides.conf
      owner: root
      group: root
      mode: "0600"
      validate: /usr/sbin/sshd -t